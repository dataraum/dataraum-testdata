[project]
name = "dataraum-testdata"
version = "0.3.0"
description = "Synthetic test data generator with known entropy injections for dataraum-context calibration"
readme = "README.md"
authors = [
    { name = "philipp", email = "suter.philipp@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.9.0",
    "polars>=1.0.0",
]

[project.scripts]
testdata = "testdata.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testdata"]

[tool.ruff]
target-version = "py314"
line-length = 120
