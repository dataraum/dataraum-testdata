# Multi-System Reconciliation Scenario
# Generates data split across 3 source systems with different schemas.
# Tests cross-source discovery and reconciliation in dataraum-context.

name: multi-system-recon
description: >
  Multi-system reconciliation for a mid-size company. Same underlying business
  events exported through 3 systems: ERP (GL data, legacy columns), banking
  feed (bank statements, PascalCase), and AP system (invoices/payments, camelCase).
  Each source is a separate directory with its own schema conventions.

tables:
  - chart_of_accounts
  - journal_entries
  - journal_lines
  - invoices
  - payments
  - bank_transactions
  - fx_rates
  - trial_balance

defaults:
  seed: 1234
  months: 6
  strategy: medium

generator:
  normalization: full
  fiscal_start: "2025-01-01"
  invoices_count: 1500

sources:
  erp_export:
    description: "Primary ERP system — general ledger and chart of accounts"
    tables:
      - chart_of_accounts
      - journal_entries
      - journal_lines
      - trial_balance
    column_style: legacy
    key_strategy: surrogate
    format: csv

  banking_feed:
    description: "Bank statement data feed — transactions and FX rates"
    tables:
      - bank_transactions
      - fx_rates
    column_style: PascalCase
    key_strategy: surrogate
    format: csv

  ap_system:
    description: "Accounts payable / procurement system — invoices and payments"
    tables:
      - invoices
      - payments
    column_style: camelCase
    key_strategy: surrogate
    format: csv

stories:
  journal_lines.debit:
    injection: corrupt_types
    story: "ERP export glitch corrupts numeric debit values"
  journal_lines.cost_center:
    injection: introduce_nulls
    story: "Optional field inconsistently populated across departments"
  bank_transactions.amount:
    injection: break_benford
    story: "Round-number batch payments from automated system"
  invoices.amount:
    injection: mix_units
    story: "Multi-currency invoices without explicit currency declaration"
  payments.date:
    injection: corrupt_dates
    story: "System format mismatch between payment processor and ERP"
